# Local development services only — the Django app runs on the host so
# manage.py and IDE debuggers work without container indirection.
#
# Usage:
#   docker compose up -d postgres redis
#   docker compose down            # stop
#   docker compose down -v         # stop + wipe data

services:
  postgres:
    image: postgres:16
    container_name: drp-postgres
    environment:
      POSTGRES_USER: drp
      POSTGRES_PASSWORD: drp
      POSTGRES_DB: drp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "drp"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
