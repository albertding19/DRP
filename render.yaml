# Render blueprint — provisions web + Postgres + Redis from one file.
#
# Usage:
#   1. Push to GitHub
#   2. On Render: New → Blueprint → connect repo
#   3. Render reads this file and provisions everything
#
# Free-tier caveats:
#   - Web service sleeps after ~15 min idle (cold start ~30s)
#   - Postgres free tier expires after 90 days; renew or upgrade
#   - Region: `frankfurt` — closest to London for low latency
#
# Cold-start mitigation for the M2 demo: point UptimeRobot at /healthz
# 30 min before the slot.
#
# Preview environments: every PR opened against `main` gets its own
# auto-deployed environment at `drp-web-pr-<n>.onrender.com` for review,
# then is torn down after 7 days of PR inactivity. See the `previews`
# block below.

previews:
  generation: manual
  # Idle previews are deleted after 7 days to keep the workspace tidy and
  # stop free-tier services from sleeping forever on stale PRs.
  expireAfterDays: 7

databases:
  - name: drp-postgres
    plan: free
    region: frankfurt
    databaseName: drp
    user: drp

services:
  # Redis for Django Channels' channel layer
  - type: redis
    name: drp-redis
    plan: free
    region: frankfurt
    ipAllowList: []  # private network only — only the web service can reach it
    maxmemoryPolicy: allkeys-lru

  # The Django app (Daphne serves HTTP + WS in one process)
  - type: web
    name: drp-web
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -e .
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      # ALLOWED_HOSTS — wildcard-match all Render subdomains. Render also
      # injects RENDER_EXTERNAL_HOSTNAME, which prod.py reads and appends.
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: DATABASE_URL
        fromDatabase:
          name: drp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drp-redis
          property: connectionString
      - key: DEBUG
        value: "False"
      # Anthropic key for L2 (Claude Haiku) content moderation. `sync: false`
      # means "expected to exist on the service but not committed here" — set
      # the value via the Render dashboard. If absent, L2 fails open per
      # `apps.moderation.services.judge_with_claude`.
      - key: ANTHROPIC_API_KEY
        sync: false
      # LiveKit Cloud credentials for body-double video calls. Same
      # sync:false pattern — set values via the Render dashboard.
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      # Resend SMTP — the API key doubles as the SMTP password (host is
      # smtp.resend.com:587, user is "resend"). DEFAULT_FROM_EMAIL must
      # use a domain verified in the Resend dashboard for deliverability.
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "unmasked <onboarding@resend.dev>"
      # Google OAuth credentials — Cloud Console → APIs & Services →
      # Credentials → OAuth 2.0 Client ID (Web application). The redirect
      # URI must match exactly what's registered in the console.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: "https://drp-web-5xwh.onrender.com/accounts/oauth/google/callback/"
      # RENDER_GIT_COMMIT is auto-injected by Render at build time
