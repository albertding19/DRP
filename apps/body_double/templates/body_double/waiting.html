{% extends "base.html" %}

{% block title %}Waiting for a body double — {{ PROJECT_NAME }}{% endblock %}

{% block content %}
<section
  class="body-double-waiting"
  x-data="waitingPage({{ wait_timeout_s }}, {{ request.user.id }}, '{% url 'body_double:status' %}')"
  x-on:ws:match_found.window="
    /* Fast path: server pushed a match event. Redirect immediately. */
    if ($event.detail && $event.detail.room_url) {
      window.location.href = $event.detail.room_url;
    }
  "
>
  <h1>Looking for a body double…</h1>

  <p class="elapsed">
    Waited <span x-text="elapsed"></span> second<span x-show="elapsed !== 1">s</span>
    <span x-show="!timedOut" class="muted">— hang tight.</span>
  </p>

  <div x-show="timedOut" x-cloak class="timed-out">
    <p>No one's available right now. Want to try again?</p>
    <form method="post" action="{% url 'body_double:find' %}" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary">Try again</button>
    </form>
  </div>

  <form method="post" action="{% url 'body_double:leave' %}" class="cancel-form">
    {% csrf_token %}
    <button type="submit" class="btn btn-secondary">Cancel</button>
  </form>
</section>

<script>
  /* Defined as a named x-data factory so the timer + WS + poll all live
     inside `init()` with `this.` references. The previous shape
     (multi-statement x-init with bare `elapsed++`) relied on `with()`
     scope binding propagating into the setInterval callback, which is
     fragile in Alpine 3 — the counter would never re-render even though
     it was incrementing internally. Using `this.elapsed++` is the
     idiomatic Alpine 3 reactive write. */
  function waitingPage(waitTimeoutS, userId, statusUrl) {
    return {
      elapsed: 0,
      timedOut: false,
      init() {
        // Open the shared WebSocket via the same store used by the feed
        // and post pages. Auto-reconnects with exponential backoff if
        // the WS drops mid-wait.
        this.$store.ws.connect("/ws/matchmaking/" + userId + "/");

        // Elapsed-time counter, ticking every second.
        setInterval(() => {
          this.elapsed += 1;
          if (this.elapsed >= waitTimeoutS) this.timedOut = true;
        }, 1000);

        // Polling fallback. If the WS misses the match_found event for
        // any reason (race during initial connect, transient
        // disconnect, etc.), this catches it within 5 seconds. The WS
        // path is faster (<100 ms) but this guarantees we don't strand
        // the user.
        setInterval(async () => {
          try {
            const r = await fetch(statusUrl, {
              headers: { Accept: "application/json" },
              credentials: "same-origin",
            });
            if (!r.ok) return;
            const data = await r.json();
            if (data.matched && data.room_url) {
              window.location.href = data.room_url;
            }
          } catch {
            /* network blip — try again on the next tick */
          }
        }, 5000);
      },
    };
  }
</script>

<style>
  [x-cloak] { display: none !important; }
  .body-double-waiting { max-width: 480px; margin: 0 auto; text-align: center; padding: 3rem 0; }
  .body-double-waiting h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
  .elapsed { font-size: 1.1rem; color: var(--fg); }
  .muted { color: var(--fg-muted); }
  .timed-out { margin: 2rem 0; padding: 1rem; background: #fef3c7; border-radius: 8px; }
  .cancel-form { margin-top: 2rem; }
</style>
{% endblock %}
